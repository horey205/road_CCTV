name: Update CCTV Streams

on:
  schedule:
    # 10분마다 자동 실행 (GitHub Actions cron 스케줄)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  update-cctv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh CCTV URLs
        run: |
          python update_cctv.py

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add cctv_data.json
          if git diff --staged --quiet; then
            echo "No changes in cctv_data.json"
          else
            git commit -m "chore: auto-update CCTV stream URLs [skip ci]"
            git push
          fi
